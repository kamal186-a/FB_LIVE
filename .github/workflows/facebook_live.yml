name: Facebook Live Streamer

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Install FFmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          pip install yt-dlp

      - name: Stream Video to Facebook Live
        env:
          STREAM_URL: ${{ secrets.FB_LIVE_URL }}
          FB_PAGE_URL: "https://www.facebook.com/share/19aoCZr8Vj/"
        run: |
          DIRECT_URL=$(yt-dlp -g "$FB_PAGE_URL")
          ffmpeg -re -i "$DIRECT_URL" \
            -c:v libx264 -preset superfast -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 \
            -f flv "$STREAM_URL"
